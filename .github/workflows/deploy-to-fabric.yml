name: Deploy to Fabric

# Optional: deploys the Fabric App (schema + static) on demand with the service principal.
# Add repository secrets CLIENT_ID, TENANT_ID, CLIENT_SECRET first.
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Allow destructive schema changes (data loss possible)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      RAYFIN_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Login to Rayfin with the service principal
        run: npx rayfin login --service-principal -t "$TENANT_ID" -u "$CLIENT_ID" -p "$CLIENT_SECRET" --encryption-fallback-enabled
      - name: Deploy
        run: npx rayfin up --workspace "FabricQuest" --yes ${{ inputs.force && '--force' || '' }}
