name: Deploy to Fabric

# Keeps the Fabric App (backend entities + static frontend) in lockstep with the GitHub Pages mirror:
# every push to main runs this AND pages.yml, so one `git push` updates both hosts.
# Needs repository secrets CLIENT_ID, TENANT_ID, CLIENT_SECRET (the Fabric API service principal).
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'rayfin/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy-to-fabric.yml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Allow destructive schema changes (data loss possible)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fabric-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLIENT_ID: ${{ secrets.CLIENT_ID }}
      TENANT_ID: ${{ secrets.TENANT_ID }}
      CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
      RAYFIN_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check secrets are present
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$TENANT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::Add repository secrets CLIENT_ID, TENANT_ID and CLIENT_SECRET (Settings → Secrets and variables → Actions)."
            exit 1
          fi
      - name: Login to Rayfin with the service principal
        run: npx rayfin login --service-principal -t "$TENANT_ID" -u "$CLIENT_ID" -p "$CLIENT_SECRET" --encryption-fallback-enabled
      - name: Deploy app + schema to the FabricQuest workspace
        run: npx rayfin up --workspace "FabricQuest" --yes ${{ inputs.force && '--force' || '' }}
