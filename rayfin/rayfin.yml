id: fabrics-quest
name: fabrics-quest
version: 1.0.0
services:
  auth:
    enabled: true
    fabric:
      enabled: true
    password:
      enabled: false
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5174
      - http://127.0.0.1:5174
      - https://early-coast-531f268ca6-centralus.webapp.fabricapps.net
  data:
    enabled: true
    dialect: mssql
  staticHosting:
    enabled: true
    assetAccess: public
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
  storage:
    enabled: false
  functions:
    enabled: false
